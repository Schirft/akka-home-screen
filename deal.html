<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Akka — Deal Praxis (demo)</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
<style>
:root {
  --akka-dark-green:      #0C2A24;
  --akka-highlight-green: #3DDC97;
  --warning: #F2B84B;
  --font-display: "Satoshi", "Inter", system-ui, sans-serif;
  --font-body:    "Satoshi", "Inter", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  min-height: 100vh; background: #f0f0ec;
  font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 20px;
}

/* ---- Phone frame ---- */
.stage { position: relative; width: 390px; height: 844px; }
.phone {
  width: 390px; height: 844px; border-radius: 54px;
  background: #1d1f22; padding: 11px; position: relative;
  box-shadow:
    0 60px 80px -30px rgba(20,30,40,0.22),
    0 25px 50px -20px rgba(20,30,40,0.14),
    0 0 0 1px rgba(255,255,255,0.06) inset;
}
.screen {
  width: 100%; height: 100%; border-radius: 44px; overflow: hidden;
  position: relative; background: var(--akka-dark-green); color: #fff;
  display: flex; flex-direction: column;
}
.notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 162px; height: 32px; background: #1d1f22; border-radius: 0 0 22px 22px; z-index: 30; }
.notch::after { content:""; position:absolute; right:26px; top:10px; width:11px; height:11px; border-radius:50%; background: radial-gradient(circle at 35% 35%, #2a3540 0%, #0a0e14 70%); }
.notch::before { content:""; position:absolute; left:38px; top:13px; width:50px; height:5px; background:#0a0e14; border-radius:4px; }
.btn-side { position: absolute; background: #1d1f22; width: 3px; }
.btn-side.silent { left: -3px; top: 110px; height: 32px; border-radius: 2px 0 0 2px; }
.btn-side.vol-up { left: -3px; top: 165px; height: 60px; border-radius: 2px 0 0 2px; }
.btn-side.vol-dn { left: -3px; top: 235px; height: 60px; border-radius: 2px 0 0 2px; }
.btn-side.power  { right: -3px; top: 200px; height: 96px; border-radius: 0 2px 2px 0; }

/* ---- Status bar ---- */
.statusbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20; height: 54px;
  padding: 18px 30px 0;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff;
  font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
  font-weight: 600; font-size: 16px; letter-spacing: -0.2px;
}
.statusbar .icons { display: flex; align-items: center; gap: 6px; }

/* ---- Hero ---- */
.hero {
  position: relative; height: 320px; flex: none; overflow: hidden;
  background:
    radial-gradient(ellipse at 28% 55%, #1a6b4a 0%, transparent 55%),
    radial-gradient(ellipse at 72% 28%, #20825a 0%, transparent 52%),
    radial-gradient(ellipse at 50% 80%, #0a3d2e 0%, transparent 60%),
    linear-gradient(160deg, #0e3b30 0%, #07211c 100%);
}
/* subtle grid pattern overlay */
.hero::before {
  content:""; position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(8,28,24,0.25) 0%, rgba(8,28,24,0) 35%, rgba(8,28,24,0) 50%, rgba(6,20,17,0.7) 88%, var(--akka-dark-green) 100%);
  z-index: 4; pointer-events:none;
}
.hero::after {
  content:""; position:absolute; inset:0;
  background: radial-gradient(ellipse 70% 50% at 50% 35%, rgba(46,180,120,0.18) 0%, transparent 70%);
  mix-blend-mode: screen; z-index: 3; pointer-events:none;
}
/* dot grid texture */
.hero-texture {
  position: absolute; inset: 0; z-index: 2;
  background-image: radial-gradient(rgba(61,220,151,0.12) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
}

.back-btn {
  position: absolute; top: 64px; left: 22px;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  z-index: 10; color: #fff; cursor: pointer;
}
.play-btn {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -65%);
  width: 50px; height: 50px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  border: 1.5px solid rgba(255,255,255,0.65);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  z-index: 6; cursor: pointer;
}
.play-btn svg { margin-left: 3px; }
.hero-title {
  position: absolute; left: 22px; right: 22px; bottom: 16px; z-index: 6;
}
.hero-title h1 {
  margin: 0 0 12px;
  font-family: var(--font-display); font-size: 38px; font-weight: 600;
  color: #fff; letter-spacing: -0.5px; line-height: 1;
}
.badges { display: flex; gap: 8px; }
.badge-pill {
  display: inline-flex; align-items: center;
  padding: 6px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.1px;
}
.badge-green { color: var(--akka-highlight-green); border: 1.5px solid var(--akka-highlight-green); background: transparent; }
.badge-grey  { color: rgba(255,255,255,0.85); border: 1.5px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); }

/* ---- Body ---- */
.body {
  flex: 1; min-height: 0; padding: 14px 22px 0;
  display: flex; flex-direction: column;
  overflow-y: auto; scrollbar-width: none;
}
.body::-webkit-scrollbar { display: none; }

.desc {
  color: rgba(255,255,255,0.62); font-size: 14.5px; font-weight: 500;
  line-height: 1.5; letter-spacing: -0.2px; margin: 0 0 14px;
}

.stat-card {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px; padding: 12px 0; margin-bottom: 10px;
}
.stat { text-align: center; border-right: 1px solid rgba(255,255,255,0.07); }
.stat:last-child { border-right: none; }
.stat-label { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 500; margin-bottom: 4px; }
.stat-value { color: #fff; font-size: 19px; font-weight: 700; letter-spacing: -0.4px; }

.risk-card {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(242,184,75,0.06); border: 1px solid rgba(242,184,75,0.14);
  border-radius: 12px; padding: 11px 16px; margin-bottom: 16px;
}
.risk-label { color: var(--warning); font-size: 13px; font-weight: 700; }
.risk-dots  { display: flex; gap: 5px; }
.risk-dot   { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.16); }
.risk-dot.on { background: var(--warning); }

.fund-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.fund-amt { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.4px; }
.days-left {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--warning); font-size: 14px; font-weight: 600;
}
.progress {
  height: 6px; border-radius: 999px;
  background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 16px;
}
.progress-fill { height: 100%; width: 60%; background: var(--akka-highlight-green); border-radius: 999px; }

.invest-row {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.07); margin-bottom: 14px;
}
.av-stack { display: flex; }
.av-stack .av { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--akka-dark-green); margin-left: -8px; }
.av-stack .av:first-child { margin-left: 0; }
.av-1 { background: radial-gradient(ellipse at 50% 35%, #d9b48a 0%, #8a5a3a 50%, #2a1810 100%); }
.av-2 { background: radial-gradient(ellipse at 50% 35%, #f4d4ba 0%, #c98a64 50%, #4a2818 100%); }
.av-3 { background: radial-gradient(ellipse at 50% 35%, #e8c8a8 0%, #a8744c 50%, #2a1810 100%); }
.invest-text { color: rgba(255,255,255,0.6); font-size: 13.5px; font-weight: 500; }

.actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.action {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px; padding: 14px 0 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
}
.action:hover { background: rgba(255,255,255,0.07); }
.action-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.action-label { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: -0.1px; }

/* ---- CTA bar ---- */
.cta-bar {
  flex: none; padding: 10px 18px 26px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(12,42,36,0) 0%, var(--akka-dark-green) 30%);
  z-index: 10;
}
.invest-cta {
  flex: 1; height: 52px; border-radius: 999px;
  background: var(--akka-highlight-green); color: var(--akka-dark-green);
  font-size: 15.5px; font-weight: 700; border: none;
  letter-spacing: -0.2px; font-family: var(--font-body); cursor: pointer;
}
.invest-cta:hover { background: #58E3A6; }
.daniel-orb {
  width: 50px; height: 50px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6FE9B5 0%, #3DDC97 18%, #0E3B30 75%, #061B17 100%);
  box-shadow: 0 0 0 2px rgba(61,220,151,0.65), 0 0 18px rgba(61,220,151,0.4);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.daniel-orb svg { width: 32px; height: 32px; }

.home-indicator {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; background: rgba(255,255,255,0.85);
  border-radius: 999px; z-index: 40;
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <span class="btn-side silent"></span>
    <span class="btn-side vol-up"></span>
    <span class="btn-side vol-dn"></span>
    <span class="btn-side power"></span>

    <div class="screen" data-screen="Deal — Praxis">
      <div class="notch"></div>

      <!-- Status bar -->
      <div class="statusbar">
        <span>12:22</span>
        <span class="icons">
          <svg width="18" height="11" viewBox="0 0 18 11" fill="none">
            <rect x="0" y="7" width="3" height="4" rx="0.6" fill="#fff"/>
            <rect x="5" y="5" width="3" height="6" rx="0.6" fill="#fff"/>
            <rect x="10" y="2.5" width="3" height="8.5" rx="0.6" fill="#fff"/>
            <rect x="15" y="0" width="3" height="11" rx="0.6" fill="#fff"/>
          </svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
            <path d="M8 2.6c2.1 0 4 .8 5.4 2.2l1-1A8 8 0 0 0 8 1.4 8 8 0 0 0 1.6 3.8l1 1A7.6 7.6 0 0 1 8 2.6Z" fill="#fff"/>
            <path d="M8 6c1.3 0 2.4.5 3.3 1.3l1-1A6 6 0 0 0 8 4.6 6 6 0 0 0 3.7 6.3l1 1A4.7 4.7 0 0 1 8 6Z" fill="#fff"/>
            <circle cx="8" cy="9.6" r="1.4" fill="#fff"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
            <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#fff" stroke-opacity="0.5" fill="none"/>
            <rect x="2" y="2" width="19" height="8" rx="1.5" fill="#fff"/>
            <path d="M24 4v4c.6-.2 1-.7 1-1.4V5.4c0-.7-.4-1.2-1-1.4Z" fill="#fff" fill-opacity="0.5"/>
          </svg>
        </span>
      </div>

      <!-- Hero -->
      <div class="hero">
        <div class="hero-texture"></div>

        <div class="back-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="play-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>

        <div class="hero-title">
          <h1>Praxis</h1>
          <div class="badges">
            <span class="badge-pill badge-green">Pre-IPO</span>
            <span class="badge-pill badge-grey">AI</span>
          </div>
        </div>
      </div>

      <!-- Scrollable body -->
      <div class="body">
        <p class="desc">The AI layer between humans and machines. Praxis is redefining how enterprises work one autonomous agent at a time.</p>

        <div class="stat-card">
          <div class="stat">
            <div class="stat-label">Valuation</div>
            <div class="stat-value">€30M</div>
          </div>
          <div class="stat">
            <div class="stat-label">Allocation</div>
            <div class="stat-value">€1–2M</div>
          </div>
          <div class="stat">
            <div class="stat-label">Target</div>
            <div class="stat-value">x2</div>
          </div>
        </div>

        <div class="risk-card">
          <span class="risk-label">Moderate risk</span>
          <div class="risk-dots">
            <span class="risk-dot on"></span>
            <span class="risk-dot on"></span>
            <span class="risk-dot on"></span>
            <span class="risk-dot"></span>
            <span class="risk-dot"></span>
          </div>
        </div>

        <div class="fund-row">
          <span class="fund-amt">€1,72M</span>
          <span class="days-left">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            5 days left
          </span>
        </div>
        <div class="progress"><div class="progress-fill"></div></div>

        <div class="invest-row">
          <div class="av-stack">
            <span class="av av-1"></span>
            <span class="av av-2"></span>
            <span class="av av-3"></span>
          </div>
          <span class="invest-text">Pedro, Laura + 1 240 have invested</span>
        </div>

        <div class="actions">
          <div class="action">
            <div class="action-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="3" stroke="#3DDC97" stroke-width="1.6"/>
                <path d="M10 9 l5 3 l-5 3 z" fill="#3DDC97"/>
              </svg>
            </div>
            <span class="action-label">Pitch Replay</span>
          </div>
          <div class="action">
            <div class="action-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M4 6c0-1.1.9-2 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-4 3.5V17H6a2 2 0 0 1-2-2z" stroke="#7B5BEC" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="9" cy="10.5" r="1" fill="#7B5BEC"/>
                <circle cx="12" cy="10.5" r="1" fill="#7B5BEC"/>
                <circle cx="15" cy="10.5" r="1" fill="#7B5BEC"/>
              </svg>
            </div>
            <span class="action-label">Discussion</span>
          </div>
          <div class="action">
            <div class="action-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M13 2 L4 13 h6 l-1 9 l9-12 h-6 z" stroke="#7B5BEC" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <span class="action-label">Summary</span>
          </div>
        </div>
      </div>

      <!-- CTA bar -->
      <div class="cta-bar">
        <button class="invest-cta">Invest in Praxis</button>
        <div class="daniel-orb">
          <svg viewBox="0 0 24 24">
            <path d="M5 24 V20 c0-2 2-3.5 6-3.5 s6 1.5 6 3.5 v4 z" fill="#0a0a0a"/>
            <path d="M9 18 l3 3 l3-3 v6 h-6 z" fill="#fff"/>
            <path d="M12 19 l-1 1 l1 3 l1-3 z" fill="#7B1E22"/>
            <ellipse cx="12" cy="11" rx="5.5" ry="6" fill="#f7f5ef"/>
            <path d="M7 9 q-1.2 3 0 6 q2-1 2.5-2.5 z" fill="#3DDC97"/>
            <path d="M17 9 q1.2 3 0 6 q-2-1-2.5-2.5 z" fill="#3DDC97"/>
            <path d="M12 4 l-1.2 3.5 h2.4 z" fill="#3DDC97"/>
            <ellipse cx="12" cy="13" rx="2.4" ry="1.7" fill="#ebe6da"/>
            <ellipse cx="10" cy="11" rx="0.6" ry="0.85" fill="#0a0a0a"/>
            <ellipse cx="14" cy="11" rx="0.6" ry="0.85" fill="#0a0a0a"/>
          </svg>
        </div>
      </div>

      <div class="home-indicator"></div>
    </div>
  </div>
</div>

</body>
</html>
