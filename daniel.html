<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Akka — Daniel Chat (demo)</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
<style>
:root {
  --akka-dark-green:      #0C2A24;
  --akka-highlight-green: #3DDC97;
  --font-display: "Satoshi", "Inter", system-ui, sans-serif;
  --font-body:    "Satoshi", "Inter", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  min-height: 100vh;
  background: #f0f0ec;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 20px;
}

/* ---- Phone frame ---- */
.stage { position: relative; width: 390px; height: 844px; }
.phone {
  position: relative; width: 390px; height: 844px;
  border-radius: 54px; background: #1d1f22; padding: 11px;
  box-shadow:
    0 60px 80px -30px rgba(20,30,40,0.22),
    0 25px 50px -20px rgba(20,30,40,0.14),
    0 0 0 1px rgba(255,255,255,0.06) inset;
}
.screen {
  width: 100%; height: 100%; border-radius: 44px;
  overflow: hidden; position: relative;
  background: var(--akka-dark-green); color: #fff;
}
.notch {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 162px; height: 32px; background: #1d1f22;
  border-radius: 0 0 22px 22px; z-index: 30;
}
.notch::after {
  content: ""; position: absolute; right: 26px; top: 10px;
  width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #2a3540 0%, #0a0e14 70%);
}
.notch::before {
  content: ""; position: absolute; left: 38px; top: 13px;
  width: 50px; height: 5px; background: #0a0e14; border-radius: 4px;
}
.btn-side { position: absolute; background: #1d1f22; width: 3px; }
.btn-side.silent { left: -3px; top: 110px; height: 32px; border-radius: 2px 0 0 2px; }
.btn-side.vol-up { left: -3px; top: 165px; height: 60px; border-radius: 2px 0 0 2px; }
.btn-side.vol-dn { left: -3px; top: 235px; height: 60px; border-radius: 2px 0 0 2px; }
.btn-side.power  { right: -3px; top: 200px; height: 96px; border-radius: 0 2px 2px 0; }

/* ---- Status bar (dimmed — modal is open) ---- */
.statusbar {
  position: relative; z-index: 5; height: 54px; padding: 18px 30px 0;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff; opacity: 0.55;
  font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
  font-weight: 600; font-size: 16px; letter-spacing: -0.2px;
}
.statusbar .icons { display: flex; align-items: center; gap: 6px; }

/* ---- Dimmed home background ---- */
.home-bg {
  position: absolute; inset: 0; padding-top: 54px;
  overflow: hidden; opacity: 0.32; pointer-events: none;
}
.scrim {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(8,30,26,0.0) 0%,
    rgba(8,30,26,0.25) 30%,
    rgba(8,30,26,0.55) 50%,
    rgba(8,30,26,0.85) 60%);
  z-index: 2; pointer-events: none;
}

/* home-bg internals */
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 14px 22px 18px;
}
.learner { display: flex; align-items: center; gap: 10px; }
.learner-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(61,220,151,0.14);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.learner-text { display: flex; flex-direction: column; gap: 5px; }
.learner-label { color: var(--akka-highlight-green); font-weight: 700; font-size: 17px; line-height: 1; }
.progress { width: 120px; height: 4px; background: rgba(255,255,255,0.10); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; width: 82%; height: 100%; background: var(--akka-highlight-green); border-radius: 999px; }
.xp { color: rgba(255,255,255,0.42); font-size: 11px; font-weight: 500; line-height: 1; }
.header-actions { display: flex; align-items: center; gap: 14px; padding-top: 2px; }
.icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: #fff; position: relative; }
.badge {
  position: absolute; top: -4px; right: -6px;
  min-width: 16px; height: 16px; background: #E5614C; color: #fff;
  border-radius: 999px; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; padding: 0 4px; line-height: 1;
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 38%, #f1d7c2 0%, #d3a380 38%, #966749 70%, #5b3a26 100%);
}

.praxis-pill {
  margin: 0 22px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(242,184,75,0.30); border-radius: 16px;
  height: 50px; padding: 0 16px;
  display: flex; align-items: center; gap: 10px; color: #F2B84B;
}
.praxis-pill .text { flex: 1; font-size: 15px; }
.praxis-pill .text strong { font-weight: 700; }
.praxis-pill .text span { color: rgba(242,184,75,0.7); font-weight: 500; margin-left: 4px; }
.praxis-pill .view { color: #F2B84B; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 4px; }
.pi-dot { width: 8px; height: 8px; border-radius: 50%; background: #F2B84B; border: 1.5px solid rgba(242,184,75,0.4); flex-shrink: 0; }

.yp-card {
  margin: 22px 22px 0; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 18px 18px 28px;
}
.yp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.yp-label { font-size: 15px; color: rgba(255,255,255,0.7); }
.yp-right { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
.traffic-dots { display: flex; gap: 4px; }
.traffic-dots .dot { width: 8px; height: 8px; border-radius: 50%; }
.traffic-dots .dot.r  { background: #E5614C; }
.traffic-dots .dot.g1 { background: var(--akka-highlight-green); }
.traffic-dots .dot.g2 { background: var(--akka-highlight-green); }
.yp-balance {
  font-family: var(--font-display); font-weight: 700;
  font-size: 36px; letter-spacing: -1.4px; color: #fff;
}

/* ============================================================
   DANIEL BOTTOM SHEET
   ============================================================ */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: 320px;
  background: #0E2A24; border-radius: 28px 28px 0 0;
  z-index: 10; display: flex; flex-direction: column;
  box-shadow: 0 -20px 40px rgba(0,0,0,0.35);
}
.grabber {
  align-self: center; margin-top: 10px;
  width: 44px; height: 5px;
  background: rgba(255,255,255,0.30); border-radius: 999px;
}

/* Daniel header */
.d-head {
  display: flex; align-items: center; gap: 14px;
  padding: 22px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.d-orb {
  width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
  background: radial-gradient(circle at 35% 35%, #6FE9B5 0%, #3DDC97 12%, #1F7A5A 45%, #0E3B30 80%);
  box-shadow: 0 0 0 2px rgba(61,220,151,0.30), 0 0 18px rgba(61,220,151,0.40);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.d-orb svg { width: 48px; height: 48px; position: relative; z-index: 2; }
.d-meta { display: flex; flex-direction: column; gap: 2px; }
.d-name {
  color: var(--akka-highlight-green); font-family: var(--font-display);
  font-weight: 700; font-size: 24px; letter-spacing: -0.5px; line-height: 1.1;
}
.d-role { color: rgba(255,255,255,0.45); font-size: 14px; font-weight: 500; }

/* Daniel message */
.d-msg {
  padding: 22px 24px 18px; color: #fff;
  font-size: 16px; line-height: 1.45; letter-spacing: -0.2px;
}

/* Quick replies */
.quick-replies { padding: 4px 18px 0; display: flex; flex-direction: column; gap: 12px; }
.qr {
  display: flex; align-items: center; gap: 14px;
  height: 56px; padding: 0 18px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
  color: #fff; font-size: 15px; font-weight: 500; letter-spacing: -0.2px;
  cursor: pointer;
}
.qr:hover { background: rgba(255,255,255,0.04); }
.qr-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.qr-icon.dot-red { background: #E5614C; width: 12px; height: 12px; border-radius: 50%; margin: 0 5px; }

/* Composer */
.composer {
  margin-top: auto; padding: 14px 18px 20px;
  display: flex; align-items: center; gap: 10px;
}
.composer-input {
  flex: 1; height: 52px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent; color: rgba(255,255,255,0.45);
  padding: 0 22px; font-size: 15px; font-family: var(--font-body); letter-spacing: -0.2px;
}
.composer-input::placeholder { color: rgba(255,255,255,0.35); }
.composer-input:focus { outline: none; border-color: rgba(61,220,151,0.4); color: #fff; }
.send-btn {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--akka-highlight-green); color: var(--akka-dark-green);
  border: none; display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.send-btn:hover { background: #58E3A6; }

.home-indicator {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; background: rgba(255,255,255,0.85); border-radius: 999px; z-index: 20;
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <span class="btn-side silent"></span>
    <span class="btn-side vol-up"></span>
    <span class="btn-side vol-dn"></span>
    <span class="btn-side power"></span>

    <div class="screen" data-screen="Akka Daniel Chat">
      <div class="notch"></div>

      <!-- Status bar (dimmed) -->
      <div class="statusbar">
        <span>12:22</span>
        <span class="icons">
          <svg width="18" height="11" viewBox="0 0 18 11" fill="none">
            <rect x="0" y="7" width="3" height="4" rx="0.6" fill="#fff"/>
            <rect x="5" y="5" width="3" height="6" rx="0.6" fill="#fff"/>
            <rect x="10" y="2.5" width="3" height="8.5" rx="0.6" fill="#fff"/>
            <rect x="15" y="0" width="3" height="11" rx="0.6" fill="#fff"/>
          </svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
            <path d="M8 2.6c2.1 0 4 .8 5.4 2.2l1-1A8 8 0 0 0 8 1.4 8 8 0 0 0 1.6 3.8l1 1A7.6 7.6 0 0 1 8 2.6Z" fill="#fff"/>
            <path d="M8 6c1.3 0 2.4.5 3.3 1.3l1-1A6 6 0 0 0 8 4.6 6 6 0 0 0 3.7 6.3l1 1A4.7 4.7 0 0 1 8 6Z" fill="#fff"/>
            <circle cx="8" cy="9.6" r="1.4" fill="#fff"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
            <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#fff" stroke-opacity="0.5" fill="none"/>
            <rect x="2" y="2" width="19" height="8" rx="1.5" fill="#fff"/>
            <path d="M24 4v4c.6-.2 1-.7 1-1.4V5.4c0-.7-.4-1.2-1-1.4Z" fill="#fff" fill-opacity="0.5"/>
          </svg>
        </span>
      </div>

      <!-- Dimmed home background -->
      <div class="home-bg">
        <div class="header">
          <div class="learner">
            <div class="learner-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 1.5l1.85 3.95 4.35.45-3.25 2.95.95 4.25L8 10.95l-3.9 2.15.95-4.25L1.8 5.9l4.35-.45L8 1.5Z" stroke="#3DDC97" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <div class="learner-text">
              <span class="learner-label">Learner</span>
              <div class="progress"><span></span></div>
              <span class="xp">820 / 1000 XP</span>
            </div>
          </div>
          <div class="header-actions">
            <div class="icon-btn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M10 19a2 2 0 0 0 4 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="icon-btn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M21.5 3.2 2.7 10.6c-.9.4-.8 1.6.1 1.9l7 2.4 2.5 7c.3.9 1.5 1 1.9.1L21.6 3.3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
                <path d="m9.8 14.9 4.3-4.3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <span class="badge">3</span>
            </div>
            <div class="avatar"></div>
          </div>
        </div>

        <div class="praxis-pill">
          <span class="pi-dot"></span>
          <span class="text"><strong>Praxis :</strong><span>2 days left</span></span>
          <span class="view">View
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
              <path d="m6 4 4 4-4 4" stroke="#F2B84B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>

        <div class="yp-card">
          <div class="yp-row">
            <span class="yp-label">Your Portfolio</span>
            <div class="yp-right">
              <div class="traffic-dots">
                <span class="dot r"></span>
                <span class="dot g1"></span>
                <span class="dot g2"></span>
              </div>
              <span>Watch out</span>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                <path d="m4 6 4 4 4-4" stroke="rgba(255,255,255,0.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="yp-balance">€28 381,31</div>
        </div>
      </div>

      <!-- Scrim overlay -->
      <div class="scrim"></div>

      <!-- DANIEL BOTTOM SHEET -->
      <div class="sheet">
        <div class="grabber"></div>

        <!-- Daniel header -->
        <div class="d-head">
          <div class="d-orb">
            <svg viewBox="0 0 48 48">
              <path d="M11 48 V40 c0-4 4-7 13-7 s13 3 13 7 v8 z" fill="#0a0a0a"/>
              <path d="M19 36 l5 5 l5-5 v8 h-10 z" fill="#fff"/>
              <path d="M24 39 l-1.6 2 l1.6 6 l1.6-6 z" fill="#7B1E22"/>
              <ellipse cx="24" cy="22" rx="10" ry="11" fill="#f7f5ef"/>
              <path d="M15 18 q-2 5 0 9 q3-2 4-4 z" fill="#3DDC97"/>
              <path d="M33 18 q2 5 0 9 q-3-2-4-4 z" fill="#3DDC97"/>
              <path d="M24 8 l-2 7 h4 z" fill="#3DDC97"/>
              <ellipse cx="24" cy="26" rx="4.5" ry="3.2" fill="#ebe6da"/>
              <ellipse cx="20.5" cy="22" rx="1" ry="1.4" fill="#0a0a0a"/>
              <ellipse cx="27.5" cy="22" rx="1" ry="1.4" fill="#0a0a0a"/>
              <path d="M15 16 l1.2 4 l3-2 z" fill="#f7f5ef"/>
              <path d="M33 16 l-1.2 4 l-3-2 z" fill="#f7f5ef"/>
              <ellipse cx="22.3" cy="27" rx="0.6" ry="0.8" fill="#0a0a0a" opacity="0.5"/>
              <ellipse cx="25.7" cy="27" rx="0.6" ry="0.8" fill="#0a0a0a" opacity="0.5"/>
            </svg>
          </div>
          <div class="d-meta">
            <span class="d-name">Daniel</span>
            <span class="d-role">Your AI coach</span>
          </div>
        </div>

        <!-- Daniel message -->
        <div class="d-msg">
          Hey, I noticed your diversification is red, do you want me to explain why?
        </div>

        <!-- Quick replies -->
        <div class="quick-replies">
          <div class="qr">
            <span class="qr-icon dot-red"></span>
            <span>Explain my red flag</span>
          </div>
          <div class="qr">
            <span class="qr-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 2c4 3 6 7 6 11l-1 6h-10l-1-6c0-4 2-8 6-11Z" stroke="#9B82DC" stroke-width="1.7" stroke-linejoin="round" fill="none"/>
                <circle cx="12" cy="10" r="2" stroke="#9B82DC" stroke-width="1.7" fill="none"/>
                <path d="m7 17-2 4 4-1M17 17l2 4-4-1" stroke="#9B82DC" stroke-width="1.7" stroke-linejoin="round" fill="none"/>
              </svg>
            </span>
            <span>Quick overview of the deal</span>
          </div>
          <div class="qr">
            <span class="qr-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M7 3h7l5 5v13H7V3Z" stroke="#6AB4D8" stroke-width="1.7" stroke-linejoin="round" fill="none"/>
                <path d="M14 3v5h5" stroke="#6AB4D8" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M10 13h6M10 17h4" stroke="#6AB4D8" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </span>
            <span>Latest club news</span>
          </div>
          <div class="qr">
            <span class="qr-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="14" width="3.5" height="6" rx="1" fill="#3DDC97"/>
                <rect x="9.25" y="9" width="3.5" height="11" rx="1" fill="#3DDC97"/>
                <rect x="15.5" y="4" width="3.5" height="16" rx="1" fill="#3DDC97"/>
              </svg>
            </span>
            <span>Portfolio performance</span>
          </div>
        </div>

        <!-- Composer -->
        <div class="composer">
          <input class="composer-input" type="text" placeholder="Ask anything…" />
          <button class="send-btn" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M21.5 3.2 2.7 10.6c-.9.4-.8 1.6.1 1.9l7 2.4 2.5 7c.3.9 1.5 1 1.9.1L21.6 3.3Z" stroke="#0C2A24" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
              <path d="m9.8 14.9 4.3-4.3" stroke="#0C2A24" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="home-indicator"></div>
    </div>
  </div>
</div>

</body>
</html>
