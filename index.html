.notch::before { content:""; position:absolute; left:38px; top:13px; width:50px; height:5px; background:#0a0e14; border-radius:4px; }
.btn-side { position: absolute; background: #1d1f22; width: 3px; }
.btn-side.silent { left: -3px; top: 110px; height: 32px; border-radius: 2px 0 0 2px; }
.btn-side.vol-up { left: -3px; top: 165px; height: 60px; border-radius: 2px 0 0 2px; }
.btn-side.vol-dn { left: -3px; top: 235px; height: 60px; border-radius: 2px 0 0 2px; }

/* ---- Status bar ---- */
.statusbar {
  flex: none; height: 54px; padding: 18px 30px 0;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff;
  font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
  font-weight: 600; font-size: 16px; letter-spacing: -0.2px;
}
.statusbar .icons { display: flex; align-items: center; gap: 6px; }

/* ---- Scrollable content ---- */
.content {
  flex: 1; min-height: 0;
  overflow-y: auto; padding: 0 22px 12px;
  scrollbar-width: none;
}
.content::-webkit-scrollbar { display: none; }

/* ---- XP header row ---- */
.xp-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 22px; gap: 14px;
}
.level-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 999px;
  background: rgba(61,220,151,0.10);
  border: 1px solid rgba(61,220,151,0.22);
  color: var(--akka-highlight-green);
  font-size: 14px; font-weight: 700; letter-spacing: -0.1px;
}
.level-pill .star {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid var(--akka-highlight-green);
  display: flex; align-items: center; justify-content: center;
}
.level-pill .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.xp-prog {
  flex: 1; max-width: 180px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.xp-prog .label { color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 500; }
.xp-prog .bar { width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.10); overflow: hidden; }
.xp-prog .bar > i { display: block; height: 100%; width: 62%; background: var(--akka-highlight-green); border-radius: 999px; }

/* ---- Section heads ---- */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-head h2 {
  margin: 0; color: #fff;
  font-size: 22px; font-weight: 700; letter-spacing: -0.4px;
  font-family: var(--font-display);
}
.streak {
  display: inline-flex; align-items: center; gap: 6px;
  color: #fff; font-size: 13px; font-weight: 600;
}

/* ---- Daily quiz card ---- */
.quiz {
  background: rgba(61,220,151,0.06);
  border: 1px solid rgba(61,220,151,0.18);
  border-radius: 18px; padding: 18px; margin-bottom: 26px;
}
.quiz-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 14px; margin-bottom: 18px;
}
.quiz-q {
  color: #fff; font-size: 16px; font-weight: 700;
  line-height: 1.35; letter-spacing: -0.2px;
}
.xp-badge {
  flex-shrink: 0; padding: 5px 10px; border-radius: 8px;
  background: rgba(61,220,151,0.14);
  color: var(--akka-highlight-green); font-size: 12px; font-weight: 700;
}
.quiz-foot { display: flex; align-items: center; justify-content: space-between; }
.quiz-meta { display: flex; flex-direction: column; gap: 8px; }
.quiz-pips { display: flex; gap: 4px; }
.quiz-pip { width: 24px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.10); }
.quiz-pip.on { background: var(--akka-highlight-green); }
.quiz-label { color: #fff; font-size: 13px; font-weight: 600; }
.answer-btn {
  padding: 10px 22px; border-radius: 999px;
  background: var(--akka-highlight-green); color: var(--akka-dark-green);
  font-size: 14px; font-weight: 700; border: none;
  font-family: var(--font-body); cursor: pointer;
}
.answer-btn:hover { background: #58E3A6; }

/* ---- Videos row ---- */
.videos {
  display: flex; gap: 12px; overflow-x: auto;
  margin: 0 -22px 26px; padding: 0 22px;
  scrollbar-width: none;
}
.videos::-webkit-scrollbar { display: none; }

.video-card {
  flex-shrink: 0; width: 200px; border-radius: 14px;
  overflow: hidden; background: rgba(255,255,255,0.04);
}
.video-thumb {
  height: 130px; position: relative; overflow: hidden;
}
/* Replace image-slot with CSS gradient backgrounds */
.video-thumb .thumb-bg {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #1f8060 0%, #0e3b30 100%);
}
.video-thumb .thumb-bg.v2 {
  background: linear-gradient(135deg, #1a5a8a 0%, #0a2a4a 100%);
}
.video-thumb .thumb-bg.v3 {
  background: linear-gradient(135deg, #5b3a8a 0%, #2a1a4a 100%);
}
/* subtle dot grid on thumbs */
.video-thumb .thumb-bg::after {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
  background-size: 16px 16px;
}
.video-thumb .play {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 1.5px solid rgba(255,255,255,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 2; cursor: pointer;
}
.video-thumb .duration {
  position: absolute; bottom: 8px; right: 8px;
  background: rgba(0,0,0,0.65); color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px; z-index: 2;
}
.video-info { padding: 12px 14px 14px; }
.video-title { color: #fff; font-size: 15px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.2px; }
.video-meta { display: flex; align-items: center; justify-content: space-between; }
.video-cat  { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 500; }
.video-xp   { color: var(--akka-highlight-green); font-size: 12px; font-weight: 700; }

/* ---- Topics grid ---- */
.topics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.topic-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 16px; padding: 16px;
}
.topic-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(123,91,236,0.16);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;

.topic-name  { color: #fff; font-size: 16px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.2px; }
.topic-meta  { color: rgba(255,255,255,0.45); font-size: 12px; font-weight: 500; margin-bottom: 12px; }
.topic-bar   { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
.topic-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #5B6FEC 0%, #B98AEC 100%); border-radius: 999px; }

/* ---- Tab bar ---- */
.tabbar {
  flex: none; height: 88px; padding: 8px 16px 28px;
  background: var(--akka-dark-green);
  border-top: 1px solid rgba(255,255,255,0.04);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: rgba(255,255,255,0.45); text-decoration: none; cursor: pointer;
}
.tab.active { color: var(--akka-highlight-green); }
.tab .label { font-size: 11px; font-weight: 600; letter-spacing: -0.1px; }

.home-indicator {
